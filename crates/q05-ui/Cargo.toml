[package]
name = "q05-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Q0.5 GPUI 界面与视频渲染"

[dependencies]
anyhow = "1"
async-channel = "2.5"
gpui-pre = "0.3.13"
gpui-pre-platform = "0.3.13"
image = "0.25.10"
q05-hid = { path = "../q05-hid" }
q05-input = { path = "../q05-input" }
q05-session = { path = "../q05-session" }
q05-video = { path = "../q05-video" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
